[project]
name = "saand"
version = "0.1.0"
description = "AI sound design from video: generates copyright-clean sound effects and background music matched to what's on screen."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "numpy>=2.1",
    "soundfile>=0.13",
    "pillow>=11.0",
    "scenedetect[opencv]>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Generation engines are installed separately: they are large, GPU-specific, and
# distributed from git rather than PyPI. `saand doctor` reports what is present, and
# each engine wrapper prints its own install command if it is missing. See README.
dev = ["pytest>=8.3", "pytest-cov>=6.0", "httpx2>=0.28"]

[project.scripts]
saand = "saand.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
